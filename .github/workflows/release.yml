name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run logic and encryption tests
        run: node --test tests/*.test.mjs
      - name: Validate version and build ZIP
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path('manifest.json').read_text())['version']
          assert re.fullmatch(r'[0-9]+(?:\.[0-9]+){0,3}', version), 'Invalid manifest version'
          tag = os.environ['RELEASE_TAG']
          if tag:
              assert tag == f'v{version}', 'Tag must match manifest.json version'
          assert Path(f'docs/releases/v{version}.md').is_file(), 'Release notes are missing'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
          PY
          python3 scripts/package.py

  release:
    if: github.event_name == 'push'
    needs: test
    concurrency:
      group: release-${{ needs.test.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tested source and tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Publish the installation ZIP and checksum to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.test.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          state=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | if .draft then \"draft\" else \"published\" end")
          if [[ "$state" == "published" ]]; then
            echo "$tag is already published."
            exit 0
          fi

          # A manually pushed tag may precede this main push. Publish its own source.
          if git show-ref --verify --quiet "refs/tags/$tag" && [[ "$(git rev-list -1 "$tag")" != "$(git rev-parse HEAD)" ]]; then
            git checkout --detach "refs/tags/$tag"
            node --test tests/*.test.mjs
          fi
          commit=$(git rev-parse HEAD)
          python3 scripts/package.py
          archive="dist/pdf-copy-cleaner-$VERSION.zip"
          (cd dist && sha256sum --check "pdf-copy-cleaner-$VERSION.zip.sha256")

          if [[ "$state" != "draft" ]]; then
            gh release create "$tag" --draft --target "$commit" --title "PDF 复制助手 $tag" --notes-file "docs/releases/$tag.md"
          fi
          gh release upload "$tag" "$archive" "$archive.sha256" --clobber
          gh release edit "$tag" --target "$commit" --notes-file "docs/releases/$tag.md" --draft=false
