name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run logic and encryption tests
        run: |
          node tests/core.test.mjs
          node tests/translation.test.mjs
          node tests/model-presets.test.mjs
      - name: Validate version and build ZIP
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('manifest.json').read_text())['version']
          tag = os.environ['RELEASE_TAG']
          if tag:
              assert tag == f'v{version}', 'Tag must match manifest.json version'
              assert Path(f'docs/releases/{tag}.md').is_file(), 'Release notes are missing'
          PY
          python3 package.py --output-dir dist

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Publish an existing version tag if it has no release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          fi
          if ! git show-ref --quiet --verify "refs/tags/$RELEASE_TAG"; then
            echo "Version tag is not pushed yet; nothing to publish."
            exit 0
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; leaving its assets unchanged."
            exit 0
          fi
          git checkout --detach "$RELEASE_TAG"
          node tests/core.test.mjs
          node tests/translation.test.mjs
          node tests/model-presets.test.mjs
          python3 package.py --output-dir dist
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            "dist/pdf-copy-cleaner-$version.zip" \
            "dist/pdf-copy-cleaner-$version.zip.sha256" \
            --verify-tag \
            --title "PDF 复制助手 $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            --latest
