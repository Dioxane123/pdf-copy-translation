<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF 复制换行转空格</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>PDF 复制换行转空格</h1>
  <label class="switch"><input type="checkbox" id="enabled"> 自动将换行替换为空格</label>
  <p id="status" role="status" aria-live="polite">正在检查…</p>
  <label class="manual"><input type="checkbox" id="manual"> 将当前标签页按 PDF 处理</label>
  <p class="hint">未自动识别 PDF 时可以勾选。离开当前文档后失效。</p>
  <div class="reader-actions"><button type="button" id="open-reader">用翻译阅读模式打开</button><button type="button" id="open-options">翻译设置</button></div>
  <p class="hint">阅读模式支持复制翻译浮窗，可选谷歌翻译或自定义模型。</p>
  <p>复制后稍等约 0.3 秒再粘贴。每个换行替换为一个空格，保留原有空格。</p>
  <p class="hint">内置阅读器的换行处理在本机完成。启用翻译后，仅将所选文字发送给你配置的翻译服务。</p>
  <p class="hint">浏览器无法提供复制来源；PDF 位于前台期间，其他程序更新的剪贴板也可能被处理。</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
